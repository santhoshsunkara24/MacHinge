<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cardGradDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A24"/>
      <stop offset="100%" stop-color="#101017"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Connecting Bus Lines -->
  <!-- Top row: Stage 1 -> 2 -> 3 -->
  <line x1="290" y1="105" x2="350" y2="105" stroke="#3A3A4C" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="348,101 356,105 348,109" fill="#5E5CE6"/>

  <line x1="630" y1="105" x2="690" y2="105" stroke="#3A3A4C" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="688,101 696,105 688,109" fill="#5E5CE6"/>

  <!-- Turn down from Stage 3 to Stage 4 -->
  <path d="M 830 170 L 830 250" stroke="#3A3A4C" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="826,248 830,256 834,248" fill="#5E5CE6"/>

  <!-- Bottom row: Stage 4 -> 5 -> 6 -->
  <line x1="690" y1="315" x2="630" y2="315" stroke="#3A3A4C" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="632,311 624,315 632,319" fill="#5E5CE6"/>

  <line x1="350" y1="315" x2="290" y2="315" stroke="#3A3A4C" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="292,311 284,315 292,319" fill="#5E5CE6"/>

  <!-- Stage 1: MacBook Physical Hinge -->
  <g transform="translate(20, 45)" filter="url(#boxShadow)">
    <rect width="270" height="120" rx="14" fill="url(#cardGradDark)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="rgba(10, 132, 255, 0.16)" stroke="rgba(10, 132, 255, 0.4)"/>
    <text x="33" y="39" fill="#0A84FF" font-family="-apple-system, system-ui, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">∠</text>
    <text x="60" y="32" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">Physical Hinge</text>
    <text x="60" y="47" fill="#A1A1A6" font-family="-apple-system, system-ui, sans-serif" font-size="11.5">User opens/closes MacBook lid</text>
    <text x="16" y="80" fill="#D1D1D6" font-family="-apple-system, system-ui, sans-serif" font-size="12.5">Continuous angle (0° to 135°)</text>
    <rect x="16" y="92" width="105" height="18" rx="4" fill="rgba(10, 132, 255, 0.14)"/>
    <text x="68" y="105" fill="#64D2FF" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" text-anchor="middle">PHYSICAL INPUT</text>
  </g>

  <!-- Stage 2: Apple SPU Sensor -->
  <g transform="translate(355, 45)" filter="url(#boxShadow)">
    <rect width="275" height="120" rx="14" fill="url(#cardGradDark)" stroke="rgba(94, 92, 230, 0.4)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="rgba(94, 92, 230, 0.16)" stroke="rgba(94, 92, 230, 0.4)"/>
    <circle cx="33" cy="33" r="6" fill="none" stroke="#5E5CE6" stroke-width="2"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">Apple SPU Sensor</text>
    <text x="60" y="47" fill="#A1A1A6" font-family="-apple-system, system-ui, sans-serif" font-size="11.5">IOKit HID (Usage 0x008A)</text>
    <text x="16" y="80" fill="#D1D1D6" font-family="-apple-system, system-ui, sans-serif" font-size="12.5">0.01° precision • 50–60 Hz rate</text>
    <rect x="16" y="92" width="135" height="18" rx="4" fill="rgba(94, 92, 230, 0.16)"/>
    <text x="83" y="105" fill="#A39DFF" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" text-anchor="middle">REPORT 7: USAGE 0x0545</text>
  </g>

  <!-- Stage 3: Decoupled Trigger -->
  <g transform="translate(695, 45)" filter="url(#boxShadow)">
    <rect width="265" height="120" rx="14" fill="url(#cardGradDark)" stroke="rgba(48, 209, 88, 0.4)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="rgba(48, 209, 88, 0.16)" stroke="rgba(48, 209, 88, 0.4)"/>
    <path d="M 27 34 L 31 38 L 39 28" stroke="#30D158" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">Decoupled Trigger</text>
    <text x="60" y="47" fill="#A1A1A6" font-family="-apple-system, system-ui, sans-serif" font-size="11.5">Threshold: ~78° to ~25°</text>
    <text x="16" y="80" fill="#D1D1D6" font-family="-apple-system, system-ui, sans-serif" font-size="12.5">100% crisp passthrough at idle</text>
    <rect x="16" y="92" width="105" height="18" rx="4" fill="rgba(48, 209, 88, 0.16)"/>
    <text x="68" y="105" fill="#30D158" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" text-anchor="middle">0% GPU AT IDLE</text>
  </g>

  <!-- Stage 4: ScreenCaptureKit Engine -->
  <g transform="translate(695, 255)" filter="url(#boxShadow)">
    <rect width="265" height="120" rx="14" fill="url(#cardGradDark)" stroke="rgba(255, 159, 10, 0.4)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="rgba(255, 159, 10, 0.16)" stroke="rgba(255, 159, 10, 0.4)"/>
    <rect x="25" y="26" width="16" height="14" rx="2" fill="none" stroke="#FF9F0A" stroke-width="2"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">ScreenCaptureKit</text>
    <text x="60" y="47" fill="#A1A1A6" font-family="-apple-system, system-ui, sans-serif" font-size="11.5">Zero-storage local pipeline</text>
    <text x="16" y="80" fill="#D1D1D6" font-family="-apple-system, system-ui, sans-serif" font-size="12.5">In-memory GPU textures only</text>
    <rect x="16" y="92" width="140" height="18" rx="4" fill="rgba(255, 159, 10, 0.16)"/>
    <text x="86" y="105" fill="#FFB340" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" text-anchor="middle">NO DISK / NO TELEMETRY</text>
  </g>

  <!-- Stage 5: Apple Metal Shaders -->
  <g transform="translate(355, 255)" filter="url(#boxShadow)">
    <rect width="275" height="120" rx="14" fill="url(#cardGradDark)" stroke="rgba(191, 90, 242, 0.4)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="rgba(191, 90, 242, 0.16)" stroke="rgba(191, 90, 242, 0.4)"/>
    <polygon points="33,24 41,38 25,38" fill="none" stroke="#BF5AF2" stroke-width="2"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">Apple Metal Shaders</text>
    <text x="60" y="47" fill="#A1A1A6" font-family="-apple-system, system-ui, sans-serif" font-size="11.5">Real-time 3D folding mesh</text>
    <text x="16" y="80" fill="#D1D1D6" font-family="-apple-system, system-ui, sans-serif" font-size="12.5">Poisson diffusion &amp; volumetric bloom</text>
    <rect x="16" y="92" width="130" height="18" rx="4" fill="rgba(191, 90, 242, 0.16)"/>
    <text x="81" y="105" fill="#D98AFF" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" text-anchor="middle">NATIVE FRAGMENT GPU</text>
  </g>

  <!-- Stage 6: Seamless Screen Overlay -->
  <g transform="translate(20, 255)" filter="url(#boxShadow)">
    <rect width="270" height="120" rx="14" fill="url(#cardGradDark)" stroke="rgba(100, 210, 255, 0.4)" stroke-width="1.2"/>
    <rect x="16" y="16" width="34" height="34" rx="8" fill="rgba(100, 210, 255, 0.16)" stroke="rgba(100, 210, 255, 0.4)"/>
    <rect x="25" y="25" width="16" height="12" rx="2" fill="none" stroke="#64D2FF" stroke-width="2"/>
    <line x1="22" y1="40" x2="44" y2="40" stroke="#64D2FF" stroke-width="2"/>
    <text x="60" y="32" fill="#FFFFFF" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600">Screen Overlay</text>
    <text x="60" y="47" fill="#A1A1A6" font-family="-apple-system, system-ui, sans-serif" font-size="11.5">WindowServer Compositor</text>
    <text x="16" y="80" fill="#D1D1D6" font-family="-apple-system, system-ui, sans-serif" font-size="12.5">Instant wake &amp; clamshell sleep</text>
    <rect x="16" y="92" width="105" height="18" rx="4" fill="rgba(100, 210, 255, 0.16)"/>
    <text x="68" y="105" fill="#64D2FF" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" text-anchor="middle">60 FPS SYNC</text>
  </g>
</svg>
